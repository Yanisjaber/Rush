# Bilan : filtre de sport (la répartition garde tous les sports), année passée, onglet Progrès
appId: fr.yanisjaber.rush
---
- launchApp
- runFlow: _ouvrir-bilan.yaml
- tapOn: "Course"
- extendedWaitUntil:
    visible: "Objectifs de 2026"
    timeout: 10000
- takeScreenshot: filtre-course
- tapOn: "Année : 2026. Changer"
- waitForAnimationToEnd
- tapOn: "2025"
- extendedWaitUntil:
    visible: "Objectifs de 2025"
    timeout: 10000
- assertVisible: "En 2025.*"
- takeScreenshot: annee-2025
- tapOn: "Progrès"
- waitForAnimationToEnd
- takeScreenshot: progres
- tapOn: "Tous"
- tapOn: "Résumé"
# Sur Progrès, le sélecteur d'année reste actif quand le niveau global du vélo s'affiche (il pilote l'écran du vélo) ; grisé sinon
- tapOn: "Progrès"
- waitForAnimationToEnd
- takeScreenshot: progres-annee-grisee
- tapOn: "Résumé"
- assertVisible: "Année : 20.*"
