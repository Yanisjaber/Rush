name: Vérifier l'app

# Vérifie que l'app (Svelte + Vite) compile, que ses tests passent et que ses dépendances de production n'ont pas de faille grave.
# Ne déploie rien : le déploiement est fait par pages.yml.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-build.yml']
  pull_request:
    paths: ['app/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci : installe EXACTEMENT ce qui est dans package-lock.json (jamais de version « flottante »).
      # --ignore-scripts : aucun script d'installation n'est exécuté (même règle que app/.npmrc).
      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Audit de sécurité (dépendances de production)
        run: npm audit --omit=dev --audit-level=high

      - name: Tests
        run: npm test

      - name: Compiler
        run: npm run build
