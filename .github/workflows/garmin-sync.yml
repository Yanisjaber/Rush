name: Synchro Garmin

# Phase de test : lancement manuel seulement (onglet Actions > Run workflow).
# Une fois qu'un run réussit, on décommente le cron pour la synchro horaire.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 * * * *'

# Aucun droit sur le dépôt : le job n'a besoin que des secrets ci-dessous.
permissions: {}

# Jamais deux synchros en même temps (évite les rate-limits Garmin).
concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install garth==0.4.47 requests==2.32.5

      # Les secrets sont masqués dans les logs, mais le dépôt est public :
      # le script n'affiche jamais de token (voir tools/garmin_sync.py).
      - name: Synchroniser le sommeil
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tools/garmin_sync.py --days 3
