name: Publier le site

# Publie l'app (Svelte + Vite, compilée) sur GitHub Pages : https://yanisjaber.github.io/coach-ia/
#
# Le job « deploy » ne tourne que si la variable de dépôt DEPLOY_PAGES vaut « true » (Réglages → Pages → Source : « GitHub Actions »).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois ; on n'interrompt jamais un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci : installe EXACTEMENT ce qui est dans package-lock.json. --ignore-scripts : aucun script d'installation.
      - name: Installer les dépendances
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Audit de sécurité (dépendances de production)
        working-directory: app
        run: npm audit --omit=dev --audit-level=high

      - name: Tests
        working-directory: app
        run: npm test

      - name: Compiler
        working-directory: app
        run: npm run build

      # Rien d'autre que l'app compilée n'est publié (ni supabase/, ni docs/, ni .env…).
      - name: Préparer le site
        run: |
          set -e
          mkdir _site
          cp -R app/dist/. _site/
          touch _site/.nojekyll
          test -f _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ vars.DEPLOY_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
